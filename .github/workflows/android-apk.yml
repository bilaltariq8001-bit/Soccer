name: Android APK

on:
  push:
    branches: [main, "hark/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (live apifootball.com data)
        working-directory: app
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          if [ -z "$APIFOOTBALL_KEY" ]; then echo "::error::Add the APIFOOTBALL_KEY repository secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PapifootballKey="$APIFOOTBALL_KEY" --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pitchside-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
